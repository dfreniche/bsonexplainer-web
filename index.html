<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BSON Explainer</title>
  <meta name="description" content="Shows how JSON is converted into BSON, byte by byte." />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="stylesheet" href="vendor/fonts.css" />
  <link rel="stylesheet" href="vendor/tokens.css" />
  <link rel="stylesheet" href="vendor/index.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="github-ribbon" href="https://github.com/dfreniche/bsonexplainer-web" target="_blank" rel="noopener">Fork me on GitHub</a>

  <header class="app-header">
    <!-- FIGLET_TITLE -->
    <p class="subtitle">Shows how JSON is converted into BSON, byte by byte. Runs in your browser. No data sent.</p>
  </header>

  <main>
    <section class="input-section">
      <label for="json-input">JSON input <span class="muted">(MongoDB Extended JSON is supported)</span></label>
      <textarea id="json-input" spellcheck="false" rows="8"></textarea>
      <p id="error" class="error" role="alert" hidden></p>
    </section>

    <div class="toolbar">
      <button type="button" data-action="expand">Expand all</button>
      <button type="button" data-action="collapse">Collapse all</button>
    </div>

    <section class="panels">
      <div class="panel">
        <h2>JSON <span id="json-size" class="muted"></span></h2>
        <div id="json-tree" class="tree" aria-label="JSON tree"></div>
      </div>
      <div class="panel">
        <div class="tabs" role="tablist" aria-label="BSON views">
          <button type="button" role="tab" id="tab-bson" aria-controls="bson-tree" aria-selected="true" data-tab="bson">BSON</button>
          <button type="button" role="tab" id="tab-hex" aria-controls="hex-dump" aria-selected="false" data-tab="hex">Hex dump</button>
          <span id="total-size" class="muted"></span>
        </div>
        <div id="bson-tree" class="tree" role="tabpanel" aria-labelledby="tab-bson"></div>
        <div id="hex-dump" class="tree hex" role="tabpanel" aria-labelledby="tab-hex" hidden></div>
      </div>
    </section>

    <p class="muted hint">Hover a row in the BSON tree or a node in the JSON tree to highlight the matching bytes in the hex dump.</p>
  </main>

  <footer class="app-footer">
    <nav aria-label="Resources">
      <a href="https://www.mongodb.com/resources/languages/bson" target="_blank" rel="noopener">What is BSON?</a>
      <a href="https://bsonspec.org/spec.html" target="_blank" rel="noopener">BSON specification</a>
      <a href="https://bug0.com/tools/json-to-bson" target="_blank" rel="noopener">JSON to BSON (bug0)</a>
      <a href="https://www.mongodb.com/docs/database-tools/bsondump/" target="_blank" rel="noopener">bsondump docs</a>
    </nav>
  </footer>

  <script type="module" src="src/app.js"></script>
</body>
</html>
